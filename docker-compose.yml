services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: turf
      POSTGRES_PASSWORD: turf
      POSTGRES_DB: turfpool
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turf -d turfpool"]
      interval: 5s
      retries: 10

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: turf
      POSTGRES_PASSWORD: turf
      POSTGRES_DB: turfpool_test
    ports: ["${DB_TEST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turf -d turfpool_test"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://turf:turf@db:5432/turfpool
      TEST_DATABASE_URL: postgresql://turf:turf@db-test:5432/turfpool_test
    depends_on:
      db: { condition: service_healthy }
      db-test: { condition: service_healthy }
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_APP_ENV: ${APP_ENV:-development}
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
