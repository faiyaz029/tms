name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turf
          POSTGRES_PASSWORD: turf
          POSTGRES_DB: turfpool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turf -d turfpool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://turf:turf@localhost:5432/turfpool_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://turf:turf@localhost:5432/turfpool_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run PostgreSQL backend tests
        run: pytest
        working-directory: backend
      - name: Check database migrations
        run: alembic check
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the Compose demo stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
      - name: Seed demo data
        run: docker compose exec -T backend python -m app.seed --reset
      - name: Run desktop and mobile end-to-end tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
